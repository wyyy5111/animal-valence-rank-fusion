[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-valence-rank-fusion"
version = "1.0.0"
description = "Low-label animal vocalization valence recognition with per-class rank fusion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wenji Wang", email = "xiaobao@henu.edu.cn"}, {name = "Yiming Yang"}, {name = "Dehua Zhang"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3,<1.11", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/wyyy5111/animal-valence-rank-fusion"
Issues = "https://github.com/wyyy5111/animal-valence-rank-fusion/issues"

[project.scripts]
animal-valence = "animal_valence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
